season: 2026

stats:
  first_season: 2022
  # 2 = regular season, 3 = postseason (1 = preseason, never ingested)
  season_types: [2, 3]
  # Event teams that appear in the schedule feed but are not franchises
  # (2026 All-Star game: TEAM COOP vs TEAM SPOON). Dropped with a reported count.
  exclude_abbreviations: [COOP, SPO]
  # NBA-derived approximation of FT attempts that end a possession — see DECISIONS.md
  ft_possession_coeff: 0.44
  # Current-season window for the date validation check (guide §2).
  # Prior seasons are validated against their own raw schedule bounds.
  season_window:
    start: "2026-05-08"
    end: "2026-09-24"
  expected_games_per_team: 44
  # ESPN player minutes are integer-rounded; team sums land within +/-3 of
  # 200 + 25/OT. Anything past this is treated as a dropped player.
  minutes_sum_tolerance: 3
  # The Cup final is an extra game coded as regular season; it must not count
  # toward the 44-game cap. Group-stage Cup games DO count.
  cup_final_note: "Commissioner's Cup Championship"

odds:
  sport_key: basketball_wnba
  # One market to start (guide §6.2); add more only after the phase 3 join works.
  markets: [player_points]
  regions: us
  # american = integer prices like -115; the storage format for over/under_price
  odds_format: american
  # Only snapshot events tipping within this many hours
  horizon_hours: 30
  # Intended capture cadence (guide §6.5): open, midday, T-60min, closing.
  # Used for the projected-monthly-usage math; scheduling itself is phase 10.
  snapshots_per_day: 4
  # Historical backfill snapshot times (UTC): ~11:30 ET for afternoon slates,
  # ~19:00 ET for evening slates. Historical calls cost 10x.
  backfill_times_utc: ["15:30", "23:00"]

features:
  # trailing windows (games) for form rates; EWM half-life in games
  windows: [3, 5, 10]
  ewm_half_life_games: 5
  # stats that get form features (per-40, sum-based within window)
  form_stats: [points, reb, ast]
  # shrinkage constants k in (n*obs + k*prior)/(n+k) — "games the prior is worth".
  # Initial values, to be tuned on validation folds in phases 6/9 (guide §8.3):
  # small season + mid-season projection => meaningfully large k.
  k_form: 10
  k_team: 8
  k_opp: 12
  k_opp_pos: 15
  # league prior = as-of season-to-date league average; below this many league
  # games, blend the previous season; with no history at all use the defaults
  min_league_games_for_prior: 30
  league_prior_defaults:   # per-40 fallbacks, only reachable at the very start of 2022
    points: 14.0
    reb: 6.6
    ast: 3.1
  # rest: cap at 7 days; anything longer (incl. the FIBA World Cup break) is its
  # own category via f_long_break, not a continuous value
  rest_cap_days: 7
  # primary ball-handler = top as-of ast/40 on roster with at least this many games
  ballhandler_min_games: 5
  # availability statuses that count as pregame-known absences (dnp_coach is a
  # game-time decision, deliberately excluded)
  out_statuses: [dnp_injury, dnp_rest, inactive]
  # leakage test sample size
  test_sample: 50
  # hours west of Eastern, for timezones-crossed (PHX: no DST, call it 2.5)
  team_tz_offsets: {ATL: 0, CHI: 1, CON: 0, DAL: 1, GS: 3, IND: 0, LA: 3, LV: 3,
                    MIN: 1, NY: 0, PHX: 2.5, POR: 3, SEA: 3, TOR: 0, WSH: 0}

minutes:
  # time-based split: train < holdout_start, evaluate on >= (never random)
  holdout_start: "2026-06-01"
  # simulations per team-game for evaluation quantiles
  sims_eval: 1000
  # Dirichlet concentration: MLE over this log-spaced grid on training rotations
  concentration_min: 5
  concentration_max: 500
  concentration_points: 25
  # fit c on the current roster-rules regime only (guide §2: pre-2026 minutes
  # distributions don't transfer cleanly under the new CBA — 2026 games only)
  concentration_since: "2026-01-01"
  seed: 20260810
  # regulation-only evaluation (OT games excluded: actual minutes incompatible
  # with the 200-minute simulation frame; OT simulation is a phase 7 concern)
  eval_regulation_only: true

clean:
  # Which player_games column settles each market (alternates share the base key)
  market_stats:
    player_points: points
  # Odds-API team display names that differ from ESPN's; empty until one appears
  team_aliases: {}
  # Fuzzy proposals below this rapidfuzz score are not even suggested
  fuzzy_cutoff: 75
